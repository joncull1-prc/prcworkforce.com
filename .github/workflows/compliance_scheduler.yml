name: UK Employment Law Weekly Digest

on:
  schedule:
    # Runs once a week — every Sunday at 00:00 UTC (midnight).
    # cron fields: minute hour day-of-month month day-of-week
    # day-of-week 0 = Sunday.
    - cron: "0 0 * * 0"
  # Allow manual runs from the Actions tab for testing.
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run UK employment law digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python fetch_uk_employment_law.py
